    </style><defs><clipPath id="clip"><rect width="440" height="264" rx="12"/></clipPath><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#e2ddd0"/></pattern></defs><rect width="440" height="264" rx="12" fill="#f6f4ee"/><rect x=".5" y=".5" width="439" height="263" rx="12" fill="none" stroke="#e2ddd0"/><text x="24" y="32" class="mono" font-size="9" fill="#9aa0a8" style="fill:#9aa0a8">03 WEB · PORTFOLIO RESEARCH</text><text x="30" y="74" font-size="11" class="mute" font-weight="400">Hold every stock equally</text><rect x="30" y="82" width="314" height="16" rx="3" fill="#9aa0a8"/><text x="352" y="94" font-size="12" font-weight="700">16.1%</text><text x="30" y="120" font-size="11" class="" font-weight="600">AI portfolio</text><rect x="30" y="128" width="283" height="16" rx="3" fill="#b27408"/><text x="321" y="140" font-size="12" font-weight="700">14.5%</text><text x="30" y="166" font-size="11" class="mute" font-weight="400">S&amp;P 500</text><rect x="30" y="174" width="214" height="16" rx="3" fill="#9aa0a8"/><text x="252" y="186" font-size="12" font-weight="700">11.0%</text><line x1="30" y1="206" x2="410" y2="206" stroke="#e2ddd0"/><text x="30" y="225" font-size="10" class="mute">Return per year, 2006–2026, after costs.</text><text x="30" y="241" font-size="10" class="mute">The no-skill baseline won, and the app says so.</text></svg>
