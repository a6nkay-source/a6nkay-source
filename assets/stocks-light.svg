<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 264" width="440" height="264" role="img" aria-label="Stock research lab backtest: equal-weight 16.1%, AI portfolio 14.5%, S&amp;P 500 11.0% per year"><style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1a1f29}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;letter-spacing:.14em}
    .mute{fill:#5e6673} .faint{fill:#9aa0a8}
