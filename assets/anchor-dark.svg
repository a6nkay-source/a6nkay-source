<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 264" width="440" height="264" role="img" aria-label="Anchor: a study dashboard with a wellness ring, live signals and a check-in prompt"><style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8edf4}
