    </style><defs><clipPath id="clip"><rect width="880" height="300" rx="14"/></clipPath><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#e2ddd0"/></pattern></defs><rect width="880" height="300" rx="14" fill="#f6f4ee"/><rect x=".5" y=".5" width="879" height="299" rx="14" fill="none" stroke="#e2ddd0"/><g clip-path="url(#clip)"><rect width="880" height="300" fill="url(#dots)" opacity=".55"/><path class="drift slow" d="M0,268 Q30.0,259 60.0,268 T120.0,268 T180.0,268 T240.0,268 T300.0,268 T360.0,268 T420.0,268 T480.0,268 T540.0,268 T600.0,268 T660.0,268 T720.0,268 T780.0,268 T840.0,268 T900.0,268 T960.0,268 T1020.0,268" fill="none" stroke="#0e8f84" stroke-width="1.5" opacity=".35"/><path class="drift" d="M0,280 Q30.0,274 60.0,280 T120.0,280 T180.0,280 T240.0,280 T300.0,280 T360.0,280 T420.0,280 T480.0,280 T540.0,280 T600.0,280 T660.0,280 T720.0,280 T780.0,280 T840.0,280 T900.0,280 T960.0,280 T1020.0,280" fill="none" stroke="#2670d6" stroke-width="1.5" opacity=".3"/></g><text x="40" y="42" class="mono" font-size="9" fill="#9aa0a8" style="fill:#9aa0a8">A6NKAY-SOURCE</text><text x="840" y="42" text-anchor="end" class="mono faint" font-size="9">SELECTED WORK · 2026</text><line x1="40" y1="58" x2="840" y2="58" stroke="#e2ddd0"/><text x="38" y="128" font-size="50" font-weight="700" letter-spacing="-1.5">Anshuman Kumar</text><text x="40" y="164" font-size="15.5" class="mute">I train models, then check whether they</text><text x="40" y="186" font-size="15.5" class="mute"><tspan font-weight="700">actually work</tspan> — on rivers, voices and</text><text x="40" y="208" font-size="15.5" class="mute">markets. Sometimes I just make a game.</text><text x="40" y="248" class="mono" font-size="9" fill="#0e8f84" style="fill:#0e8f84">01 WATER</text><text x="123.0" y="248" class="mono" font-size="9" fill="#6a4fd8" style="fill:#6a4fd8">02 HEALTH</text><text x="213.4" y="248" class="mono" font-size="9" fill="#b27408" style="fill:#b27408">03 MARKETS</text><text x="311.20000000000005" y="248" class="mono" font-size="9" fill="#2670d6" style="fill:#2670d6">04 LEARNING</text><text x="416.40000000000003" y="248" class="mono" font-size="9" fill="#d02a78" style="fill:#d02a78">05 GAMES</text><rect x="492" y="78" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="492" y="92" width="2.5" height="22" rx="1" fill="#0e8f84"/><text x="506" y="102" class="mono" font-size="8" fill="#0e8f84" style="fill:#0e8f84">01 · RESEARCH</text><text x="506" y="128" font-size="15" font-weight="650">Hydrosense</text><text x="506" y="146" font-size="10" class="mute">Nitrate forecasts for US rivers</text><rect x="670" y="78" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="670" y="92" width="2.5" height="22" rx="1" fill="#6a4fd8"/><text x="684" y="102" class="mono" font-size="8" fill="#6a4fd8" style="fill:#6a4fd8">02 · RESEARCH</text><text x="684" y="128" font-size="15" font-weight="650">PD Voice Model</text><text x="684" y="146" font-size="10" class="mute">Tested on unseen cohorts</text><rect x="492" y="174" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="492" y="188" width="2.5" height="22" rx="1" fill="#b27408"/><text x="506" y="198" class="mono" font-size="8" fill="#b27408" style="fill:#b27408">03 · WEB</text><text x="506" y="224" font-size="15" font-weight="650">Stock Research Lab</text><text x="506" y="242" font-size="10" class="mute">74 stocks, honest backtests</text><rect x="670" y="174" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="670" y="188" width="2.5" height="22" rx="1" fill="#2670d6"/><text x="684" y="198" class="mono" font-size="8" fill="#2670d6" style="fill:#2670d6">04 · WEB</text><text x="684" y="224" font-size="15" font-weight="650">Anchor</text><text x="684" y="242" font-size="10" class="mute">A study space that checks in</text></svg>
