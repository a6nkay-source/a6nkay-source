<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Anshuman Kumar: machine learning for health, finance and the environment"><style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1a1f29}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace} .sp{letter-spacing:.14em}
    .mute{fill:#5e6673} .faint{fill:#9aa0a8}
    @keyframes drift{to{transform:translateX(-176px)}}
    .ecg{animation:drift 3.2s linear infinite}
    @keyframes type{0%{transform:translateX(0)}55%,100%{transform:translateX(404px)}}
    .cover{animation:type 4.5s steps(52,end) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:blink .9s steps(1) infinite}
    @keyframes show{0%,33.23%{opacity:1}33.33%,100%{opacity:0}}
    .ln{opacity:0;animation:show 13.5s linear infinite}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}}
    .card{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
    @keyframes pulse{50%{opacity:.35}}
    .live{animation:pulse 1.6s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.cover{display:none}.ln:first-of-type{opacity:1}}
