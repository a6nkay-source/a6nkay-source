>health, finance and the environment</tspan>, then test</text><text x="40" y="196" font-size="15" class="mute">them on data they have never seen.</text><rect x="40" y="212" width="420" height="34" rx="7" fill="#ffffff" stroke="#e2ddd0"/><text x="52" y="234" class="mono" font-size="12" font-weight="700" style="fill:#0e8f84">›</text><g clip-path="url(#term)"><text class="ln mono" style="animation-delay:0.0s" x="66" y="234" font-size="11">med-tech: Parkinson's voice AI, 4 cohorts, 366 subjects</text><text class="ln mono" style="animation-delay:4.5s" x="66" y="234" font-size="11">business: 74 stocks, 20-year walk-forward backtests</text><text class="ln mono" style="animation-delay:9.0s" x="66" y="234" font-size="11">stack: Python · PyTorch · LightGBM · TypeScript · Next.js</text><g class="cover"><rect x="64" y="214" width="420" height="30" fill="#ffffff"/><rect class="caret" x="65" y="222" width="6.5" height="14" fill="#0e8f84"/></g></g><text x="40" y="268" class="mono sp" font-size="9" style="fill:#6a4fd8">01 MED-TECH</text><text x="145.2" y="268" class="mono sp" font-size="9" style="fill:#0e8f84">02 RESEARCH</text><text x="250.39999999999998" y="268" class="mono sp" font-size="9" style="fill:#b27408">03 BUSINESS</text><text x="355.59999999999997" y="268" class="mono sp" font-size="9" style="fill:#2670d6">04 ENGINEERING</text><g class="card" style="animation-delay:0.15s"><rect x="492" y="78" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="492" y="92" width="2.5" height="22" rx="1" fill="#6a4fd8"/><text x="506" y="102" class="mono sp" font-size="8" style="fill:#6a4fd8">01 · MED-TECH</text><text x="506" y="128" font-size="15" font-weight="650">Parkinson's Voice AI</text><text x="506" y="146" font-size="10" class="mute">4 cohorts · 366 subjects</text></g><g class="card" style="animation-delay:0.27s"><rect x="670" y="78" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="670" y="92" width="2.5" height="22" rx="1" fill="#2670d6"/><text x="684" y="102" class="mono sp" font-size="8" style="fill:#2670d6">02 · HEALTH</text><text x="684" y="128" font-size="15" font-weight="650">Anchor</text><text x="684" y="146" font-size="10" class="mute">Wellness signals, on-device</text></g><g class="card" style="animation-delay:0.39s"><rect x="492" y="174" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="492" y="188" width="2.5" height="22" rx="1" fill="#b27408"/><text x="506" y="198" class="mono sp" font-size="8" style="fill:#b27408">03 · BUSINESS</text><text x="506" y="224" font-size="15" font-weight="650">Stock Research Lab</text><text x="506" y="242" font-size="10" class="mute">74 stocks · 20-year backtest</text></g><g class="card" style="animation-delay:0.51s"><rect x="670" y="174" width="168" height="86" rx="9" fill="#ffffff" stroke="#e2ddd0"/><rect x="670" y="188" width="2.5" height="22" rx="1" fill="#0e8f84"/><text x="684" y="198" class="mono sp" font-size="8" style="fill:#0e8f84">04 · ENVIRONMENT</text><text x="684" y="224" font-size="15" font-weight="650">Hydrosense</text><text x="684" y="242" font-size="10" class="mute">359 USGS river stations</text></g></svg>
